# ============================================================
# ACRAS — Continuous Integration Pipeline
# ============================================================
# Triggers: push/PR to master, and manual dispatch.
# Strategy: lint first (fail-fast), then run all three test
#           suites (unit, integration, API) in parallel.
# ============================================================

name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

    # Cancel in-progress runs for the same branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Lint & Format Check
  # Runs first. All test jobs are gated behind this job.
  # ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@883057165b84437a108f9121c2698563f72a8165 # v5.2.1
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies (libcairo2 for xhtml2pdf)
        run:
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libcairo2-dev

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run ruff linter
        run: uv run ruff check . --output-format=github

      - name: Run ruff formatter check
        run: uv run ruff format --check .

  # ──────────────────────────────────────────────────────────
  # JOB 2: Type Check (pyright)
  # Runs in parallel with tests, gated behind lint.
  # ──────────────────────────────────────────────────────────
  type-check:
    name: Type Check (pyright)
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@883057165b84437a108f9121c2698563f72a8165 # v5.2.1
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies (libcairo2 for xhtml2pdf)
        run:
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libcairo2-dev

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run pyright type check
        env:
          PYTHONPATH: "."
        run: uv run pyright src/

  # ──────────────────────────────────────────────────────────
  # JOB 3: Unit Tests
  # Runs in parallel with integration and API tests.
  # ──────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@883057165b84437a108f9121c2698563f72a8165 # v5.2.1
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies (libcairo2 for xhtml2pdf)
        run:
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libcairo2-dev

      - name: Install all dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        env:
          PYTHONPATH: "."
        run: uv run pytest tests/unit/ -v --cov=src --cov-fail-under=40

  # ──────────────────────────────────────────────────────────
  # JOB 3: Integration Tests
  # ──────────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@883057165b84437a108f9121c2698563f72a8165 # v5.2.1
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies (libcairo2 for xhtml2pdf)
        run:
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libcairo2-dev

      - name: Install all dependencies
        run: uv sync --extra dev

      - name: Run integration tests
        env:
          PYTHONPATH: "."
        run: uv run pytest tests/integration/ -v

  # ──────────────────────────────────────────────────────────
  # JOB 4: API / Service Tests
  # ──────────────────────────────────────────────────────────
  test-api:
    name: API Tests (Prediction Service)
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@883057165b84437a108f9121c2698563f72a8165 # v5.2.1
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies (libcairo2 for xhtml2pdf)
        run:
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libcairo2-dev

      - name: Install all dependencies
        run: uv sync --extra dev

      - name: Run API tests
        env:
          PYTHONPATH: "."
        run: uv run pytest tests/app/ -v

  # ──────────────────────────────────────────────────────────
  # JOB 5: Qualitative Evaluations (LLM-as-a-Judge)
  # Blocks merges if the agent fails the golden dataset thresholds.
  # ──────────────────────────────────────────────────────────
  test-qualitative:
    name: Qualitative Eval (LLM Judge)
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@883057165b84437a108f9121c2698563f72a8165 # v5.2.1
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies (libcairo2 for xhtml2pdf)
        run:
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libcairo2-dev

      - name: Install all dependencies
        run: uv sync --extra dev

      - name: Run LLM-as-a-Judge Evaluation Suite
        env:
          PYTHONPATH: "."
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ENV: testing
        run: uv run python scripts/run_evals.py

  # ──────────────────────────────────────────────────────────
  # JOB 6: Security & Vulnerability Scanning
  # Scans the repository and local files for vulnerabilities.
  # ──────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@18f2514ee49ff2d4e9bc66ccd3ef22a8ec42646c # v0.28.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          exit-code: "1" # Fail the build if vulnerabilities are found
          severity: "CRITICAL,HIGH"
