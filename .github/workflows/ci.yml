# ============================================================
# ACRAS — Continuous Integration Pipeline
# ============================================================
# Triggers: push/PR to master, and manual dispatch.
# Strategy: lint first (fail-fast), then run all three test
#           suites (unit, integration, API) in parallel.
# ============================================================

name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs for the same branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Lint & Format Check
  # Runs first. All test jobs are gated behind this job.
  # ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies (libcairo2 for xhtml2pdf)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libcairo2-dev

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run ruff linter
        run: uv run ruff check . --output-format=github

      - name: Run ruff formatter check
        run: uv run ruff format --check .

  # ──────────────────────────────────────────────────────────
  # JOB 2: Unit Tests
  # Runs in parallel with integration and API tests.
  # ──────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies (libcairo2 for xhtml2pdf)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libcairo2-dev

      - name: Install all dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        env:
          PYTHONPATH: "."
        run: uv run pytest tests/unit/ -v

  # ──────────────────────────────────────────────────────────
  # JOB 3: Integration Tests
  # ──────────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies (libcairo2 for xhtml2pdf)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libcairo2-dev

      - name: Install all dependencies
        run: uv sync --extra dev

      - name: Run integration tests
        env:
          PYTHONPATH: "."
        run: uv run pytest tests/integration/ -v

  # ──────────────────────────────────────────────────────────
  # JOB 4: API / Service Tests
  # ──────────────────────────────────────────────────────────
  test-api:
    name: API Tests (Prediction Service)
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies (libcairo2 for xhtml2pdf)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libcairo2-dev

      - name: Install all dependencies
        run: uv sync --extra dev

      - name: Run API tests
        env:
          PYTHONPATH: "."
        run: uv run pytest tests/app/ -v
