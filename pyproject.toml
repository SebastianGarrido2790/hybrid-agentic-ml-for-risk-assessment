[project]
name = "acras"
version = "0.1.0"
description = "Agentic Credit Risk Assessment System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "langchain>=0.1.0",
    "langchain-google-genai>=0.0.9",
    "langchain-huggingface>=0.0.6",
    "google-generativeai>=0.4.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "streamlit>=1.31.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "plotly>=5.18.0",
    "dvc>=3.42.0",
    "python-box>=7.0.0",
    "ensure>=1.0.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
    "jinja2>=3.1.0",
    "mlflow>=3.9.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "fpdf2>=2.8.6",
    "markdown>=3.10.2",
    "xhtml2pdf>=0.2.17",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "slowapi>=0.1.9",
    "great-expectations>=1.17.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "nbconvert>=7.16.0",
    "ipykernel>=6.29.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Small-scale logic tests",
    "integration: Multi-component workflow tests",
    "eval: Agent qualitative evaluations",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
exclude = [
    "notebooks/",
    "tests/",
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]   # pycodestyle, pyflakes, isort, pyupgrade
ignore = ["E501"]                  # line-length handled by formatter

[tool.ruff.format]
quote-style = "double"
